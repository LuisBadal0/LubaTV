name: Rust checks

# Formatting, lints and unit tests for the Rust backend in src-tauri.
# Run the same commands locally from src-tauri before pushing:
#   cargo fmt --check
#   cargo clippy --all-targets -- -D warnings
#   cargo test

on:
  push:
    branches: ["**"]
    paths: ["src-tauri/**", ".github/workflows/rust-checks.yml"]
  pull_request:
    branches: ["main"]
    paths: ["src-tauri/**", ".github/workflows/rust-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt, clippy
          cache-workspaces: src-tauri -> target

      - name: Formatting
        run: cargo fmt --check

      - name: Install the Linux libraries Tauri builds against
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      # tauri::generate_context! needs the frontend folder to exist. The checks don't
      # need the real frontend, so an empty folder saves building Angular here.
      - name: Placeholder frontend
        run: mkdir -p ../dist/lubatv/browser

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Tests marked #[ignore] need mpv or download files; run them locally with
      # `cargo test -- --ignored`.
      - name: Tests
        run: cargo test --locked
