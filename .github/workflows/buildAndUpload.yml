name: Build and Release

# Every push and pull request builds the Windows installers and Linux packages.
# A push to main (a merged pull request) also publishes them as GitHub release
# v<version>, unless that version was already released: bump the version in
# tauri.conf.json, package.json and src-tauri/Cargo.toml to publish a new one.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions must match
        id: read
        run: |
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          npm=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tauri.conf.json=$tauri package.json=$npm Cargo.toml=$cargo"
          if [ "$tauri" != "$npm" ] || [ "$tauri" != "$cargo" ]; then
            echo "::error::Versions differ: tauri.conf.json $tauri, package.json $npm, src-tauri/Cargo.toml $cargo"
            exit 1
          fi
          echo "version=$tauri" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}

    strategy:
      # Let each platform finish even if another fails, so one flaky download
      # does not hide the result of the other build.
      fail-fast: false
      matrix:
        node-version: [24.x]
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Download player files
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # The versions pinned in src-tauri/player-files.json, checked against their checksums.
          ./scripts/fetch-windows-deps.ps1 -Download
          Get-ChildItem src-tauri/deps

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install deps linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - name: Install deps project
        run: |
          npm ci

      - name: Build Windows installers
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # Signs the update installers for the in-app updater (see plugins.updater in
          # tauri.conf.json). Missing on pull requests from forks; those get no update installers.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $bundle = "src-tauri/target/release/bundle"
          New-Item -ItemType Directory installers | Out-Null

          # Full installers, with the player files, for new installs.
          npm run build:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$bundle/nsis/*-setup.exe", "$bundle/msi/*.msi" installers/

          # Update installers, without the player files, for the in-app updater (about 10 MB
          # instead of 100). LubaTV then gets only the player files that changed.
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Remove-Item "$bundle/nsis", "$bundle/msi" -Recurse -Force
            npx tauri bundle --bundles nsis,msi --config src-tauri/tauri.windows-update.conf.json --config src-tauri/tauri.updater.conf.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($file in Get-ChildItem "$bundle/nsis/*-setup.exe", "$bundle/msi/*.msi") {
              $name = $file.Name -replace '-setup\.exe$', '-update.exe' -replace '\.msi$', '-update.msi'
              Copy-Item $file.FullName "installers/$name"
              Copy-Item "$($file.FullName).sig" "installers/$name.sig"
            }
          } else {
            Write-Host "::warning::No updater signing key; building no update installers"
          }
          Get-ChildItem installers | Format-Table Name, Length

      - name: Build Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          npm run tauri build -- --bundles deb,rpm

      - name: Upload Windows installers
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lubatv-windows
          path: installers/*
          if-no-files-found: error
          retention-days: 60

      - name: Upload Linux packages
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lubatv-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 60

  release:
    name: Publish release
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip versions that are already released
        id: existing
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released. Bump the version to publish a new release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installers
        if: steps.existing.outputs.skip == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true

      - name: Create release
        if: steps.existing.outputs.skip == 'false'
        run: |
          # The Linux artifacts keep their bundle folders (deb/, rpm/), so collect the files
          # themselves: the full installers people download. Make sure all four are there.
          mapfile -t files < <(find installers -type f \( -name "*-setup.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" \) ! -name "*-update.*" | sort)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::Expected 4 installers (.exe, .msi, .deb, .rpm), found ${#files[@]}"
            find installers -type f
            exit 1
          fi
          printf '%s\n' "${files[@]}"

          # latest.json tells installed copies about this version (the updater endpoint is
          # releases/latest/download/latest.json). It points at the update installers, which
          # leave out the player files, and needs their signatures.
          nsis=$(find installers -type f -name "*-update.exe" | head -1)
          msi=$(find installers -type f -name "*-update.msi" | head -1)
          extra=()
          if [ -n "$nsis" ] && [ -n "$msi" ] && [ -f "$nsis.sig" ] && [ -f "$msi.sig" ]; then
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
            jq -n \
              --arg version "${TAG#v}" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg notes "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
              --arg nsisUrl "$base/$(basename "$nsis")" --arg nsisSig "$(cat "$nsis.sig")" \
              --arg msiUrl "$base/$(basename "$msi")" --arg msiSig "$(cat "$msi.sig")" \
              '{version: $version, notes: $notes, pub_date: $date, platforms: {
                 "windows-x86_64": {signature: $nsisSig, url: $nsisUrl},
                 "windows-x86_64-nsis": {signature: $nsisSig, url: $nsisUrl},
                 "windows-x86_64-msi": {signature: $msiSig, url: $msiUrl}}}' > latest.json
            cat latest.json
            extra=(latest.json "$nsis" "$nsis.sig" "$msi" "$msi.sig")
          else
            echo "::warning::No signed update installers; this release will not reach installed copies automatically"
          fi
          cat > notes.md <<'EOF'
          ## Install

          - **Windows:** run `LubaTV_*_x64-setup.exe` (installs for your user, no admin needed) or the `.msi` (installs for all users). mpv, ffmpeg and yt-dlp are included. The installers are not code-signed yet, so Windows SmartScreen may warn: choose **More info → Run anyway**. From v1.2.0, LubaTV offers new versions itself; you can also use **Settings → About → Check for updates**.
          - **Debian / Ubuntu:** `sudo apt install ./LubaTV_*_amd64.deb`
          - **Fedora / openSUSE:** install the `.rpm` with your package manager.

          On Linux, mpv, ffmpeg and yt-dlp come from your distribution.

          The `-update` installers are what LubaTV downloads to update itself. They leave out the player files, which LubaTV downloads only when they change.
          EOF
          gh release create "$TAG" "${files[@]}" "${extra[@]}" \
            --target "$GITHUB_SHA" \
            --title "LubaTV $TAG" \
            --latest \
            --notes-file notes.md \
            --generate-notes
