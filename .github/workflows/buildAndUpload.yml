name: Build and Upload

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Let each platform finish even if another fails, so one flaky download
      # does not hide the result of the other build.
      fail-fast: false
      matrix:
        node-version: [20.x]
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Download player files
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # Lets the script fall back to the GitHub API when nightly.link is unavailable.
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/fetch-windows-deps.ps1 -Download
          New-Item -Path 'C:\lubatv-deps' -ItemType Directory -Force | Out-Null
          Copy-Item src-tauri/deps/* C:\lubatv-deps
          Get-ChildItem C:\lubatv-deps

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install deps linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - name: Install deps project
        run: |
          npm install

      - name: Build
        if: startsWith(matrix.os, 'macos-')
        run: |
          CI=true npm run tauri build

      - name: Build
        if: matrix.os == 'windows-latest'
        run: |
          npm run tauri build

      - name: Build
        if: matrix.os == 'ubuntu-22.04'
        run: |
          npm run tauri build -- --bundles deb,rpm
          
      - name: Upload MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lubatv-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 60

      - name: Upload DEB
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: lubatv-debian
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 60

      - name: Upload RPM
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: lubatv-redhat
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 60

      - name: Upload DMG ARM64
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lubatv-mac-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 60

      - name: Upload DMG AMD64
        if: matrix.os == 'macos-13'
        uses: actions/upload-artifact@v4
        with:
          name: lubatv-mac-AMD64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 60
