<div class="controls" data-tauri-drag-region>
  <button type="button" class="wc-btn" (click)="minimize()" title="Minimize" aria-label="Minimize" tabindex="-1">
    <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" /></svg>
  </button>
  <button type="button" class="wc-btn" (click)="toggleMaximize()" [title]="maximized ? 'Restore' : 'Maximize'"
    [attr.aria-label]="maximized ? 'Restore' : 'Maximize'" tabindex="-1">
    @if (!maximized) {
      <svg viewBox="0 0 10 10" aria-hidden="true">
        <rect x="0.5" y="0.5" width="9" height="9" rx="1.5" />
      </svg>
    }
    @if (maximized) {
      <svg viewBox="0 0 10 10" aria-hidden="true">
        <rect x="0.5" y="2.5" width="7" height="7" rx="1.2" />
        <path d="M2.5 2.5V1.7c0-.66.54-1.2 1.2-1.2h4.6c.66 0 1.2.54 1.2 1.2v4.6c0 .66-.54 1.2-1.2 1.2h-.8" />
      </svg>
    }
  </button>
  <button type="button" class="wc-btn close" (click)="close()" title="Close" aria-label="Close" tabindex="-1">
    <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" /></svg>
  </button>
</div>
