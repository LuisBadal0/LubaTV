<div [attr.id]="idPrefix + id" tabindex="0" class="tile" [class.wide]="variant === 'wide'" [class.category]="isGroup()"
  [class.playing]="starting" [class.faded]="fade" [ngbTooltip]="tooltip" #tip="ngbTooltip" triggers="manual"
  placement="top" container="body" (mouseenter)="hoverTip(tip)" (mouseleave)="hideTip(tip)"
  (focus)="focusTip($event, tip)" (blur)="hideTip(tip)" (click)="click()" (keyup.enter)="click()"
  (contextmenu)="onRightClick($event)">

  <!-- Continue watching -->
  <div *ngIf="variant === 'wide'" class="wide-body" [attr.style]="tintStyle">
    <span class="logo sm">
      <img *ngIf="channel?.image && showImage" (error)="showImage = false" loading="lazy" decoding="async"
        [src]="channel?.image" alt="" />
      <span *ngIf="!channel?.image || !showImage" class="initials">{{ initials }}</span>
    </span>
    <span class="wide-text">
      <span class="nm">{{ displayName }}</span>
      <span class="sub">{{ starting ? "Starting…" : wideSubtitle() }}</span>
    </span>
    <span class="play-btn"><app-icon name="play" /></span>
  </div>

  <!-- Category -->
  <div *ngIf="variant !== 'wide' && isGroup()" class="cat-body" [attr.style]="tintStyle">
    <span class="tag" *ngIf="tag">{{ tag }}</span>
    <h3>{{ displayName }}</h3>
    <p>{{ countText() }}</p>
    <div class="stack" *ngIf="previewImages().length; else catIcon">
      <span class="mini" *ngFor="let image of previewImages()">
        <img [src]="image" loading="lazy" decoding="async" alt="" (error)="hidePreview(image)" />
      </span>
    </div>
    <ng-template #catIcon><app-icon name="library" class="cat-icon" /></ng-template>
  </div>

  <!-- Channel, movie, series, season -->
  <ng-container *ngIf="variant !== 'wide' && !isGroup()">
    <div class="plate" [attr.style]="tintStyle">
      <span class="badge" [class.live]="isLivestream()">{{ badgeText() }}</span>
      <span class="tag" *ngIf="tag">{{ tag }}</span>
      <img *ngIf="channel?.image && showImage" class="logo-img" (error)="showImage = false" loading="lazy"
        decoding="async" [src]="channel?.image" alt="" />
      <span *ngIf="!channel?.image || !showImage" class="logo"><span class="initials">{{ initials }}</span></span>
      <span class="eq" *ngIf="starting"><span></span><span></span><span></span><span></span></span>
    </div>
    <div class="meta">
      <div class="nm">{{ displayName }}</div>
      <div class="sub">
        <app-icon *ngIf="channel?.favorite" name="star" class="fav" />
        <app-icon *ngIf="channel?.tv_archive" name="archive" class="arch" />
        <span class="sub-text">{{ starting ? "Starting…" : getSourceName() }}</span>
      </div>
    </div>
  </ng-container>
</div>

<div style="visibility: hidden; position: fixed" [style.left.px]="menuTopLeftPosition.x"
  [style.top.px]="menuTopLeftPosition.y" [matMenuTriggerFor]="rightMenu"></div>

<mat-menu #rightMenu="matMenu">
  <ng-template matMenuContent let-item="item">
    <button [hidden]="viewMode != viewModeEnum.History" mat-menu-item (click)="removeFromHistory()">
      <app-icon name="history" />Remove from history
    </button>
    <button [hidden]="
        channel?.media_type == mediaTypeEnum.group || channel?.media_type == mediaTypeEnum.season || viewMode == viewModeEnum.History
      " mat-menu-item (click)="favorite()">
      <app-icon [name]="alreadyExistsInFav ? 'starOff' : 'star'" />{{ alreadyExistsInFav ? "Remove from favorites" :
      "Add to favorites" }}
    </button>
    <button [hidden]="!isLivestream()" mat-menu-item (click)="record()"><app-icon name="record" />Record</button>
    <button [hidden]="!isMovie() || downloading" mat-menu-item (click)="downloadVod()">
      <app-icon name="download" />Download
    </button>
    <button [hidden]="!isMovie() || !downloading" mat-menu-item (click)="cancelDownload()">
      <app-icon name="close" />Cancel download
    </button>
    <button [hidden]="!showEPG()" mat-menu-item (click)="showEPGModal()"><app-icon name="guide" />TV guide</button>
    <button [hidden]="!isLivestream()" mat-menu-item (click)="openRestreamModal()">
      <app-icon name="cast" />Re-stream
    </button>
    <button [hidden]="!isCustom()" mat-menu-item (click)="edit()"><app-icon name="pen" />Edit</button>
    <button [hidden]="!isCustom()" mat-menu-item (click)="share()"><app-icon name="share" />Share</button>
    <button mat-menu-item
      [hidden]="channel?.media_type == mediaTypeEnum.group || channel?.media_type == mediaTypeEnum.season"
      (click)="copyURL()"><app-icon name="copy" />Copy URL</button>
    <button [hidden]="isCustom() || viewMode == viewModeEnum.History" mat-menu-item (click)="hide()">
      <app-icon [name]="alreadyHidden ? 'eye' : 'eyeOff'" />{{ alreadyHidden ? "Unhide" : "Hide" }}
    </button>
    <button [hidden]="!isCustom()" mat-menu-item (click)="delete()"><app-icon name="trash" />Delete</button>
  </ng-template>
</mat-menu>
