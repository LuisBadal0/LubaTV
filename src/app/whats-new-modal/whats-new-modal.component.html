<div class="modal-header">
  <h4 class="modal-title lbl">What's new in LubaTV v{{ memory.AppVersion }}</h4>
</div>
<div class="modal-body">
  <h3>Automatic updates</h3>
  <ul>
    <li>LubaTV now tells you when a new version is out and installs it in a few seconds</li>
    <li>Check by hand any time in Settings → About → Check for updates</li>
    <li>Updates are signed, so LubaTV only installs versions published by this project</li>
  </ul>
</div>
<div class="modal-footer">
  <button class="btn btn-primary" (click)="close()">
    <span>Get started</span>
  </button>
</div>
