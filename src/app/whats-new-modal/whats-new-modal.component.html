<div class="modal-header">
  <h4 class="modal-title lbl">What's new in LubaTV v{{ memory.AppVersion }}</h4>
</div>
<div class="modal-body">
  @if (notes) {
    <app-release-notes [notes]="notes" />
  } @else if (loaded) {
    <p>
      This version's notes are on the
      <a [href]="releaseUrl()" target="_blank">LubaTV releases page</a>.
    </p>
  }
</div>
<div class="modal-footer">
  <button class="btn btn-primary" (click)="close()">
    <span>Get started</span>
  </button>
</div>
