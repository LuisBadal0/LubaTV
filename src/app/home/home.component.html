<ng-keyboard-shortcuts [shortcuts]="shortcuts"></ng-keyboard-shortcuts>
<ng-keyboard-shortcuts-help [key]="'f1'" [closeKey]="'escape'" [title]="'Help'" />

<header class="lt-page-header home-header">
  <div class="container-lg header-inner">
    <span class="lt-brand">
      <img src="assets/brand/lubatv-icon.svg" alt="" />
      <span class="brand-name">Luba<span class="lt-brand-accent">TV</span></span>
    </span>

    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
      </svg>
      <input autocomplete="off" type="text" id="search" #search class="form-control search-input"
        placeholder="Search channels, movies and series…" />
      <div class="search-actions">
        <button type="button" class="lt-icon-btn" (click)="toggleKeywords()" [class.active]="filters?.use_keywords"
          title="Search by keywords">
          <svg viewBox="0 0 24 24">
            <path
              d="M22 13C22 13.53 21.79 14.04 21.41 14.41L21 14.83C20.91 11.97 18.84 9.62 16.11 9.11L11 4H4V11L9.11 16.11C9.62 18.84 11.97 20.91 14.83 21L14.41 21.41C14.04 21.79 13.53 22 13 22C12.47 22 11.97 21.79 11.59 21.42L2.59 12.42C2.21 12.04 2 11.53 2 11V4C2 2.9 2.9 2 4 2H11C11.53 2 12.04 2.21 12.41 2.58L21.41 11.58C21.79 11.96 22 12.47 22 13M5 6.5C5 7.33 5.67 8 6.5 8S8 7.33 8 6.5 7.33 5 6.5 5 5 5.67 5 6.5M15.11 10.61C12.61 10.61 10.61 12.61 10.61 15.11S12.61 19.61 15.11 19.61C16 19.61 16.8 19.36 17.5 18.93L20.61 22L22 20.61L18.92 17.5C19.36 16.82 19.61 16 19.61 15.11C19.61 12.61 17.61 10.61 15.11 10.61M15.11 12.61C16.5 12.61 17.61 13.73 17.61 15.11S16.5 17.61 15.11 17.61 12.61 16.5 12.61 15.11 13.73 12.61 15.11 12.61" />
          </svg>
        </button>
        <app-sort-button></app-sort-button>
        <button type="button" class="lt-icon-btn reload-btn" (click)="reload()" title="Reload view">
          <svg viewBox="0 0 24 24">
            <path
              d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z" />
          </svg>
        </button>
        <button type="button" class="lt-icon-btn" [matMenuTriggerFor]="bulkMenu"
          [class.disabled]="filters?.series_id && !filters?.season" title="Bulk actions">
          <svg viewBox="0 0 24 24">
            <path
              d="M6,2A4,4 0 0,1 10,6V8H14V6A4,4 0 0,1 18,2A4,4 0 0,1 22,6A4,4 0 0,1 18,10H16V14H18A4,4 0 0,1 22,18A4,4 0 0,1 18,22A4,4 0 0,1 14,18V16H10V18A4,4 0 0,1 6,22A4,4 0 0,1 2,18A4,4 0 0,1 6,14H8V10H6A4,4 0 0,1 2,6A4,4 0 0,1 6,2M16,18A2,2 0 0,0 18,20A2,2 0 0,0 20,18A2,2 0 0,0 18,16H16V18M14,10H10V14H14V10M6,16A2,2 0 0,0 4,18A2,2 0 0,0 6,20A2,2 0 0,0 8,18V16H6M8,6A2,2 0 0,0 6,4A2,2 0 0,0 4,6A2,2 0 0,0 6,8H8V6M18,8A2,2 0 0,0 20,6A2,2 0 0,0 18,4A2,2 0 0,0 16,6V8H18Z" />
          </svg>
        </button>
        <mat-menu #bulkMenu="matMenu">
          <button mat-menu-item (click)="bulkAction(bulkActionType.Hide)">Hide all</button>
          <button mat-menu-item (click)="bulkAction(bulkActionType.Unhide)">Unhide all</button>
          <button mat-menu-item (click)="bulkAction(bulkActionType.Favorite)"
            [disabled]="filters?.view_type == viewModeEnum.Categories">Favorite all</button>
          <button mat-menu-item (click)="bulkAction(bulkActionType.Unfavorite)"
            [disabled]="filters?.view_type == viewModeEnum.Categories">Unfavorite all</button>
        </mat-menu>
      </div>
    </div>

    <button type="button" class="lt-icon-btn settings-btn" (click)="openSettings()" title="Settings">
      <svg viewBox="0 0 24 24">
        <path
          d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
      </svg>
    </button>
  </div>
</header>

<main class="container-lg home-main">
  <div class="toolbar">
    <div class="btn-group lt-segmented" role="group" aria-label="View">
      <button id="viewMode-0" (click)="switchMode(viewModeEnum.All)" class="btn"
        [class.active]="filters?.view_type == viewModeEnum.All">All</button>
      <button id="viewMode-1" (click)="switchMode(viewModeEnum.Categories)" class="btn"
        [class.active]="filters?.view_type == viewModeEnum.Categories">Categories</button>
      <button id="viewMode-2" (click)="switchMode(viewModeEnum.History)" class="btn"
        [class.active]="filters?.view_type == viewModeEnum.History">History</button>
      <button id="viewMode-3" (click)="switchMode(viewModeEnum.Favorites)" class="btn"
        [class.active]="filters?.view_type == viewModeEnum.Favorites">Favorites</button>
      <button id="viewMode-4" (click)="switchMode(viewModeEnum.Hidden)" class="btn"
        [class.active]="filters?.view_type == viewModeEnum.Hidden">Hidden</button>
    </div>

    <div class="filter-box" *ngIf="filtersVisible()" @fadeInOut>
      <div class="form-check form-check-inline form-switch">
        <input [(ngModel)]="chkLiveStream" (ngModelChange)="updateMediaTypes(mediaTypeEnum.livestream)"
          class="form-check-input" id="filter-0" type="checkbox" />
        <label class="form-check-label" for="filter-0">Live</label>
      </div>
      <div class="form-check form-check-inline form-switch">
        <input [(ngModel)]="chkMovie" (ngModelChange)="updateMediaTypes(mediaTypeEnum.movie)" class="form-check-input"
          id="filter-1" type="checkbox" />
        <label *ngIf="hasXtream" class="form-check-label" for="filter-1">Movies</label>
        <label *ngIf="!hasXtream" class="form-check-label" for="filter-1">Movies &amp; series</label>
      </div>
      <div *ngIf="hasXtream" class="form-check form-check-inline form-switch">
        <input [(ngModel)]="chkSerie" (ngModelChange)="updateMediaTypes(mediaTypeEnum.serie)" class="form-check-input"
          id="filter-2" type="checkbox" />
        <label class="form-check-label" for="filter-2">Series</label>
      </div>
    </div>
  </div>

  <div class="breadcrumb-row" *ngIf="(filters?.view_type == viewModeEnum.Categories && filters?.group_id) || filters?.series_id">
    <button type="button" class="lt-icon-btn back-btn" (click)="goBack()" title="Back">
      <svg viewBox="0 0 24 24">
        <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
      </svg>
    </button>
    <h4 *ngIf="this.nodeStack.hasNodes()" class="breadcrumb-title">
      {{ this.nodeStack.get()?.toString() }}
    </h4>
  </div>

  <div class="row gy-3" [@fade]="channelsVisible ? 'visible' : 'hidden'">
    <app-channel-tile [attr.id]="i == 0 ? 'first' : null" *ngFor="let channel of channels; let i = index; trackBy: trackChannel"
      class="col-lg-4 col-md-4" [id]="i" [channel]="channel" [viewMode]="viewType"></app-channel-tile>
  </div>

  <div class="empty-state" *ngIf="filters && !loading && channels.length == 0">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M21,17H3V5H21M21,3H3A2,2 0 0,0 1,5V17A2,2 0 0,0 3,19H8V21H16V19H21A2,2 0 0,0 23,17V5A2,2 0 0,0 21,3Z" />
    </svg>
    <p class="empty-title">Nothing to show here</p>
    <p class="empty-hint" *ngIf="filters.query">No results for “{{ filters.query }}”. Try another search.</p>
    <p class="empty-hint" *ngIf="!filters.query">Try another view or turn on more media types.</p>
  </div>

  <button [@fade]="channelsVisible ? 'visible' : 'hidden'" *ngIf="reachedMax === false" (click)="loadMore()"
    class="btn btn-outline-primary mx-auto d-block load-more">
    Load more
  </button>
</main>

<button type="button" *ngIf="showScrollTop" (click)="scrollToTop()" class="scroll-to-top" title="Back to top">
  <svg viewBox="0 0 24 24">
    <path fill="currentColor" d="M7.41,15.41L12,10.83L16.59,15.41L18,14L12,8L6,14L7.41,15.41Z" />
  </svg>
</button>
